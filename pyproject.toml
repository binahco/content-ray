[project]
name = "llm-content-ray"
version = "0.1.0"
description = "content-ray: escáner de corpus — normaliza archivos con parser-io y produce un digest LLM validado (semana 10)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
content-ray = "content_ray.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_ray"]

[dependency-groups]
dev = ["pytest>=8,<9"]